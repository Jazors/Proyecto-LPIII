{% if request.endpoint != 'login' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FrontEnd Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block cssCustom %}
    {% endblock %}
</head>
<body>
    <header class="header">
            <a href="{{ url_for('index') }}">
                <img class="header__logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Logotipo">
            </a>
    </header>

        <nav class="navegacion">
            <a href="{{ url_for('index') }}" class="navegacion__enlace {{ 'navegacion__enlace--activo' if request.endpoint == 'index' }}">Tienda</a>
            <a href="{{ url_for('nosotros') }}" class="navegacion__enlace {{ 'navegacion__enlace--activo' if request.endpoint == 'nosotros' }}">Nosotros</a>
        </nav>

    <main class="contenedor">
        {% block contenido %} 
            {% endblock %}
    </main>

    <footer class="footer">
        <p class="footer__texto">La Gamboneta Operativa - &copy;Todos los derechos Reservados 2026.</p>
    </footer>
</body>
</html>
{% endif %}
