{% extends 'base.html' %}


{% block contenido %}
    
<h1>Iniciar sesión</h1>
<form class="formulario-login" method="POST">
    <div class="row justify-content-center">
        <div class="col-12">
            <!-- Mostrar mensajes flash -->
            {% with messages=get_flashed_messages(with_categories=True) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
    </div>
    <label for="email">Email</label>
    <input type="email" class="formulario__campo" name="email" id="email">

    <label for="password">Contraseña</label>
    <input type="password" class="formulario__campo" name="password" id="password">

    <button type="submit" class="formulario__submit">Entrar</button>
</form>
{% endblock %}
